<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NikoPDF</title>
  <meta name="description" content="PDFを画面共有して、コメントを右から左へ流すサイトです。">
  <meta name="theme-color" content="#110f0c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23110f0c'/%3E%3Cpath d='M8 6h12l6 6v14H8z' fill='%23f6f1e8'/%3E%3Cpath d='M20 6v6h6' fill='%23e7d7c3'/%3E%3Cpath d='M5 21h22' stroke='%23e23b2f' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean)
      var last = parts[parts.length - 1]
      var cut = 0
      if (last === 'host' || last === 'view') cut = 2
      else if (last === 'index.html' || last === '404.html') cut = 1
      var baseParts = parts.slice(0, Math.max(0, parts.length - cut))
      var base = baseParts.length ? '/' + baseParts.join('/') + '/' : '/'
      window.__NIKOPDF_BASE__ = base
      var link = document.createElement('link')
      link.rel = 'stylesheet'
      link.href = base + 'css/app.css'
      document.head.appendChild(link)
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript><p>JavaScriptを有効にすると、PDFの共有とコメントが使えます。</p></noscript>
  <script>
    var script = document.createElement('script')
    script.type = 'module'
    script.src = window.__NIKOPDF_BASE__ + 'js/app.js'
    document.body.appendChild(script)
  </script>
</body>
</html>
